spring:
  datasource:
    url: jdbc:h2:mem:catalog_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
scm360:
  outbox:
    relay:
      enabled: false

eureka:
  client:
    enabled: false
