server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
              - "http://127.0.0.1:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: identity-service-auth
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: identityCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        - id: identity-service-users
          uri: lb://identity-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: identityCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        - id: catalog-service-products
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/products/**
          filters:
            - name: CircuitBreaker
              args:
                name: catalogCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        - id: catalog-service-categories
          uri: lb://catalog-service
          predicates:
            - Path=/api/v1/categories/**
          filters:
            - name: CircuitBreaker
              args:
                name: catalogCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        - id: supplier-service-suppliers
          uri: lb://supplier-service
          predicates:
            - Path=/api/v1/suppliers/**
          filters:
            - name: CircuitBreaker
              args:
                name: supplierCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        - id: supplier-service-portal
          uri: lb://supplier-service
          predicates:
            - Path=/api/v1/portal/**
          filters:
            - name: CircuitBreaker
              args:
                name: supplierCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        - id: procurement-service
          uri: lb://procurement-service
          predicates:
            - Path=/api/v1/procurement/**, /api/v1/requisitions/**, /api/v1/purchase-orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: procurementCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/v1/inventory/**, /api/v1/stock/**, /api/v1/reservations/**
          filters:
            - name: CircuitBreaker
              args:
                name: inventoryCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        - id: warehouse-service
          uri: lb://warehouse-service
          predicates:
            - Path=/api/v1/warehouses/**, /api/v1/receipts/**, /api/v1/putaway/**, /api/v1/pick-lists/**, /api/v1/transfers/**, /api/v1/cycle-counts/**
          filters:
            - name: CircuitBreaker
              args:
                name: warehouseCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        - id: transportation-service
          uri: lb://transportation-service
          predicates:
            - Path=/api/v1/transportation/**, /api/v1/carriers/**, /api/v1/shipments/**
          filters:
            - name: CircuitBreaker
              args:
                name: transportCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - name: CircuitBreaker
              args:
                name: analyticsCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: CircuitBreaker
              args:
                name: notificationCircuitBreaker
                fallbackUri: forward:/fallback/service-unavailable

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
